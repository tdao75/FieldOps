name: FieldOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FieldOps.sln

      - name: Build
        run: >
          dotnet build FieldOps.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          tests/FieldOps.WorkOrders.Api.Tests
          --configuration Release
          --no-build

  frontend:
    name: Build React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/fieldops-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/fieldops-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build