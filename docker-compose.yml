services:
  postgres:
    image: postgres:17-alpine
    container_name: fieldops-postgres
    environment:
      POSTGRES_DB: fieldops_workorders
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fieldops-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fieldops -d fieldops_workorders
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fieldops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fieldops
      RABBITMQ_DEFAULT_PASS: fieldops_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fieldops-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - check_running
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: fieldops-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fieldops-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fieldops.com
      PGADMIN_DEFAULT_PASSWORD: fieldops_admin_password
    ports:
      - "5050:80"
    volumes:
      - fieldops-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  technicians-api:
    image: fieldops-technicians:local
    build:
      context: .
      dockerfile: src/FieldOps.Technicians.Api/Dockerfile
    container_name: fieldops-technicians-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TechniciansDatabase: Host=postgres;Port=5432;Database=fieldops_technicians;Username=fieldops;Password=fieldops_dev_password
    ports:
      - "5072:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  identity-api:
    image: fieldops-identity:local
    build:
      context: .
      dockerfile: src/FieldOps.Identity.Api/Dockerfile
    container_name: fieldops-identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDatabase: Host=postgres;Port=5432;Database=fieldops_identity;Username=fieldops;Password=fieldops_dev_password
    ports:
      - "5090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  workorders-api:
    image: fieldops-workorders:local
    build:
      context: .
      dockerfile: src/FieldOps.WorkOrders.Api/Dockerfile
    container_name: fieldops-workorders-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WorkOrdersDatabase: Host=postgres;Port=5432;Database=fieldops_workorders;Username=fieldops;Password=fieldops_dev_password
      RabbitMq__HostName: rabbitmq
      ServiceUrls__TechniciansApi: http://technicians-api:8080/
    ports:
      - "5062:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      technicians-api:
        condition: service_started
    restart: unless-stopped

  notification-worker:
    image: fieldops-notification-worker:local
    build:
      context: .
      dockerfile: src/FieldOps.Notification.Worker/Dockerfile
    container_name: fieldops-notification-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__NotificationsDatabase: Data Source=/data/fieldops-notifications.db
      RabbitMq__HostName: rabbitmq
      Smtp__Host: mailpit
    volumes:
      - fieldops-notification-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: fieldops-gateway:local
    build:
      context: .
      dockerfile: src/FieldOps.ApiGateway/Dockerfile
    container_name: fieldops-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__work-orders-cluster__Destinations__primary__Address: http://workorders-api:8080/
      ReverseProxy__Clusters__technicians-cluster__Destinations__primary__Address: http://technicians-api:8080/
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: http://identity-api:8080/
    ports:
      - "5080:8080"
    depends_on:
      workorders-api:
        condition: service_started
      technicians-api:
        condition: service_started
      identity-api:
        condition: service_started
    restart: unless-stopped

  web:
    image: fieldops-web:local
    build:
      context: .
      dockerfile: src/fieldops-web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
    container_name: fieldops-web
    ports:
      - "5174:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  fieldops-postgres-data:
  fieldops-rabbitmq-data:
  fieldops-pgadmin-data:
  fieldops-notification-data: